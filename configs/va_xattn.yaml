# Phase 3 static-fusion ablation: GoogLeNet visual + PANN audio, 'xattn' fusion.
# Needs data/features/<dataset>/audio_pann.h5 (python -m vidsum.features.extract_audio_pann).
dataset: tvsum
modalities: [googlenet, audio_pann]   # first modality is the query for xattn

model:
  d_model: 512
  fusion: xattn
  heads: 8
  block_size: 60
  init_type: xavier
  init_gain: 1.4142

train:
  n_epochs: 400
  batch_size: 20
  lr: 5.0e-4
  l2_req: 1.0e-5
  clip: 5.0
  seed: 12345
  reg_factor: 0.6

select:
  start_epoch: 20
